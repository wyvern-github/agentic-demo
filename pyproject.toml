[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quickpad"
version = "0.1.0"
description = "A small single-document PyQt6 editor"
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]

[tool.setuptools.packages.find]
include = ["quickpad*"]

[tool.pytest.ini_options]
qt_api = "pyqt6"
testpaths = ["tests"]
